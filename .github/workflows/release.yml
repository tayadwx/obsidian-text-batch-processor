name: Release Obsidian 插件

# 仅在推送「版本 tag」时发布，平时 push 代码不再自动发版。
# - 正式版：v1.0.1          → 普通 Release（标记为 Latest）
# - 测试版：v1.1.0-beta.1   → 预发布 Release（Pre-release，不抢占 Latest，仅供 BRAT 测试用户）
on:
  push:
    tags:
      - 'v*.*.*'          # 正式版（如 v1.0.1）
      - 'v*.*.*-beta.*'   # 测试版（如 v1.1.0-beta.1）

# 允许工作流创建 / 上传 Release
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖并构建
        run: |
          npm ci
          npm run build

      - name: 校验 manifest.json 版本与 tag 一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MAN=$(node -p "require('./manifest.json').version")
          if [ "$TAG" != "$MAN" ]; then
            echo "::error::tag($TAG) 与 manifest.json 版本($MAN) 不一致，请先同步 manifest.json 再打 tag"
            exit 1
          fi

      - name: 发布 Release（测试版自动标记为预发布）
        uses: softprops/action-gh-release@v2
        with:
          # tag 含 "-"（如 v1.1.0-beta.1）即标记为预发布
          prerelease: ${{ contains(github.ref_name, '-') }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            manifest.json
            main.js
            styles.css

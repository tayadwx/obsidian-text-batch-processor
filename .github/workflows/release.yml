name: Release Obsidian 插件

# 推送 main 分支后自动构建并发布 Release。
# 版本号取自 manifest.json（如 1.1.0-beta1），无需手动打 tag。
# 版本号含 "-"（如 1.1.0-beta1）自动标记为预发布（Pre-release）。
# 支持重复 push：发布前先删除已存在的同名 Release / Tag，实现覆盖更新。
on:
  push:
    branches:
      - main

# 允许工作流创建 / 上传 Release
permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖并构建
        run: |
          npm ci
          npm run build

      - name: 读取版本号
        id: version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "本次发版版本：$VERSION"

      - name: 删除已存在的同名 Release / Tag（支持重复 push 覆盖）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release delete "$TAG" --yes || true
          git push --delete origin "$TAG" || true
          git tag -d "$TAG" || true

      - name: 发布 Release（测试版自动标记为预发布）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.version }}
          # 版本号含 "-"（如 1.1.0-beta1）即标记为预发布
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            manifest.json
            main.js
            styles.css
